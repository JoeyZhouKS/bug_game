<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发动机原理动画演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.2em;
            color: #aaa;
            margin-bottom: 30px;
        }

        .engine-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .engine {
            position: relative;
            width: 400px;
            height: 500px;
            background: #2d3748;
            border-radius: 15px;
            overflow: hidden;
        }

        .cylinder {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 300px;
            background: linear-gradient(to right, #4a5568, #718096, #4a5568);
            border: 3px solid #2d3748;
        }

        .piston {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 50px;
            background: linear-gradient(to bottom, #a0aec0, #718096);
            border-radius: 5px;
            transition: top 0.1s ease-in-out;
        }

        .piston-ring {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #2d3748;
            top: 15px;
        }

        .piston-ring:nth-child(2) {
            top: 30px;
        }

        .spark-plug {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 20px;
            width: 20px;
            height: 40px;
            background: #e2e8f0;
            border-radius: 3px 3px 0 0;
        }

        .spark {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 55px;
            width: 0;
            height: 0;
            opacity: 0;
        }

        .spark.active {
            animation: sparkAnim 0.3s ease-out;
        }

        @keyframes sparkAnim {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                background: #ffff00;
                border-radius: 50%;
            }
            50% {
                width: 30px;
                height: 30px;
                opacity: 0.8;
                background: #ff6600;
                border-radius: 50%;
            }
            100% {
                width: 60px;
                height: 60px;
                opacity: 0;
                background: #ff0000;
                border-radius: 50%;
            }
        }

        .combustion-chamber {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 0;
            top: 100px;
            transition: all 0.1s ease-in-out;
        }

        .intake-valve, .exhaust-valve {
            position: absolute;
            top: 90px;
            width: 30px;
            height: 20px;
            background: #718096;
            border-radius: 3px;
            transition: transform 0.2s ease-in-out;
        }

        .intake-valve {
            left: 145px;
        }

        .exhaust-valve {
            right: 145px;
        }

        .valve-open {
            transform: translateY(10px);
        }

        .gas-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(45deg, #4299e1, #3182ce);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #718096;
            cursor: not-allowed;
            transform: none;
        }

        .info-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .info-box h3 {
            color: #4299e1;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .info-box p {
            color: #e2e8f0;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .cycle-indicator {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .cycle-step {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease-in-out;
        }

        .cycle-step.active {
            background: rgba(66, 153, 225, 0.3);
            transform: scale(1.05);
        }

        .cycle-step h4 {
            color: #4299e1;
            margin-bottom: 5px;
        }

        .cycle-step p {
            font-size: 0.8em;
            color: #a0aec0;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .speed-control label {
            color: #e2e8f0;
        }

        .speed-control input[type="range"] {
            width: 150px;
        }

        .status-text {
            text-align: center;
            font-size: 1.2em;
            color: #ffd93d;
            margin-top: 15px;
            font-weight: bold;
        }

        .flywheel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border: 8px solid #4a5568;
            border-radius: 50%;
            border-top-color: #e2e8f0;
        }

        .flywheel.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .engine-container {
            animation: floatIn 0.8s ease-out;
        }

        .control-panel {
            animation: floatIn 0.8s ease-out 0.2s both;
        }

        .info-panel {
            animation: floatIn 0.8s ease-out 0.4s both;
        }
    </style>
</head>
<body>
    <h1>🔧 发动机原理动画演示</h1>
    <p class="subtitle">四冲程内燃机工作原理可视化</p>

    <div class="engine-container">
        <div class="engine">
            <div class="spark-plug"></div>
            <div class="spark" id="spark"></div>
            <div class="cylinder"></div>
            <div class="piston" id="piston">
                <div class="piston-ring"></div>
                <div class="piston-ring"></div>
            </div>
            <div class="combustion-chamber" id="combustion"></div>
            <div class="intake-valve" id="intake"></div>
            <div class="exhaust-valve" id="exhaust"></div>
            <div class="flywheel" id="flywheel"></div>
        </div>

        <div class="cycle-indicator">
            <div class="cycle-step" id="step1">
                <h4>1. 进气冲程</h4>
                <p>活塞下行，吸入混合气</p>
            </div>
            <div class="cycle-step" id="step2">
                <h4>2. 压缩冲程</h4>
                <p>活塞上行，压缩混合气</p>
            </div>
            <div class="cycle-step" id="step3">
                <h4>3. 做功冲程</h4>
                <p>火花塞点火，推动活塞</p>
            </div>
            <div class="cycle-step" id="step4">
                <h4>4. 排气冲程</h4>
                <p>活塞上行，排出废气</p>
            </div>
        </div>

        <div class="control-panel">
            <div class="controls">
                <button id="startBtn">▶ 启动引擎</button>
                <button id="pauseBtn" disabled>⏸ 暂停</button>
                <button id="resetBtn">🔄 重置</button>
            </div>

            <div class="speed-control">
                <label>转速控制:</label>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                <span id="speedValue">5</span>
            </div>

            <div class="status-text" id="status">准备启动</div>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-box">
            <h3>🔥 进气冲程</h3>
            <p>进气门打开，活塞向下运动，空气和燃料的混合气体被吸入气缸</p>
        </div>
        <div class="info-box">
            <h3>📦 压缩冲程</h3>
            <p>进气门关闭，活塞向上运动，压缩混合气体，提高温度和压力</p>
        </div>
        <div class="info-box">
            <h3>💥 做功冲程</h3>
            <p>火花塞点火，混合气燃烧膨胀，产生巨大压力推动活塞下行</p>
        </div>
        <div class="info-box">
            <h3>💨 排气冲程</h3>
            <p>排气门打开，活塞向上运动，将燃烧后的废气排出气缸</p>
        </div>
    </div>

    <script>
        class EngineSimulation {
            constructor() {
                this.isRunning = false;
                this.currentCycle = 0;
                this.pistonPosition = 100;
                this.speed = 5;
                this.animationId = null;
                this.gasParticles = [];
                this.initElements();
                this.initEvents();
                this.createGasParticles();
            }

            initElements() {
                this.piston = document.getElementById('piston');
                this.spark = document.getElementById('spark');
                this.combustion = document.getElementById('combustion');
                this.intake = document.getElementById('intake');
                this.exhaust = document.getElementById('exhaust');
                this.flywheel = document.getElementById('flywheel');
                this.startBtn = document.getElementById('startBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.speedSlider = document.getElementById('speedSlider');
                this.speedValue = document.getElementById('speedValue');
                this.status = document.getElementById('status');
            }

            initEvents() {
                this.startBtn.addEventListener('click', () => this.start());
                this.pauseBtn.addEventListener('click', () => this.pause());
                this.resetBtn.addEventListener('click', () => this.reset());
                this.speedSlider.addEventListener('input', (e) => {
                    this.speed = parseInt(e.target.value);
                    this.speedValue.textContent = this.speed;
                });
            }

            createGasParticles() {
                const engine = document.querySelector('.engine');
                for (let i = 0; i < 20; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'gas-particle';
                    engine.appendChild(particle);
                    this.gasParticles.push(particle);
                }
            }

            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.startBtn.disabled = true;
                    this.pauseBtn.disabled = false;
                    this.flywheel.classList.add('spinning');
                    this.status.textContent = '引擎运行中...';
                    this.animate();
                }
            }

            pause() {
                this.isRunning = false;
                this.startBtn.disabled = false;
                this.pauseBtn.disabled = true;
                this.flywheel.classList.remove('spinning');
                this.status.textContent = '引擎已暂停';
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
            }

            reset() {
                this.pause();
                this.currentCycle = 0;
                this.pistonPosition = 100;
                this.updatePistonPosition();
                this.updateCycleIndicator();
                this.status.textContent = '已重置，准备启动';
                this.spark.classList.remove('active');
                this.combustion.style.height = '0';
                this.combustion.style.background = 'transparent';
                this.intake.classList.remove('valve-open');
                this.exhaust.classList.remove('valve-open');
                this.gasParticles.forEach(p => {
                    p.style.opacity = '0';
                });
            }

            animate() {
                if (!this.isRunning) return;

                this.currentCycle += 0.02 * this.speed;
                if (this.currentCycle >= 4) {
                    this.currentCycle = 0;
                }

                this.updateEngineState();
                this.updatePistonPosition();
                this.updateCycleIndicator();
                this.updateGasParticles();

                this.animationId = requestAnimationFrame(() => this.animate());
            }

            updateEngineState() {
                const cycle = this.currentCycle;

                // 重置状态
                this.spark.classList.remove('active');
                this.intake.classList.remove('valve-open');
                this.exhaust.classList.remove('valve-open');

                // 进气冲程 (0-1)
                if (cycle >= 0 && cycle < 1) {
                    this.intake.classList.add('valve-open');
                    this.status.textContent = '进气冲程 - 吸入混合气';
                    this.combustion.style.background = 'rgba(100, 150, 255, 0.3)';
                }
                // 压缩冲程 (1-2)
                else if (cycle >= 1 && cycle < 2) {
                    this.status.textContent = '压缩冲程 - 压缩混合气';
                    this.combustion.style.background = 'rgba(255, 200, 100, 0.5)';
                }
                // 做功冲程 (2-3)
                else if (cycle >= 2 && cycle < 3) {
                    if (cycle < 2.1) {
                        this.spark.classList.add('active');
                    }
                    this.status.textContent = '做功冲程 - 燃烧推动活塞';
                    this.combustion.style.background = 'rgba(255, 100, 50, 0.7)';
                }
                // 排气冲程 (3-4)
                else if (cycle >= 3 && cycle < 4) {
                    this.exhaust.classList.add('valve-open');
                    this.status.textContent = '排气冲程 - 排出废气';
                    this.combustion.style.background = 'rgba(150, 150, 150, 0.4)';
                }
            }

            updatePistonPosition() {
                const cycle = this.currentCycle;
                let position;

                // 根据冲程计算活塞位置
                if (cycle >= 0 && cycle < 1) {
                    // 进气 - 活塞下行
                    position = 100 + (cycle * 150);
                } else if (cycle >= 1 && cycle < 2) {
                    // 压缩 - 活塞上行
                    position = 250 - ((cycle - 1) * 150);
                } else if (cycle >= 2 && cycle < 3) {
                    // 做功 - 活塞下行
                    position = 100 + ((cycle - 2) * 150);
                } else {
                    // 排气 - 活塞上行
                    position = 250 - ((cycle - 3) * 150);
                }

                this.pistonPosition = position;
                this.updatePistonPosition();
            }

            updatePistonPosition() {
                this.piston.style.top = `${this.pistonPosition}px`;
                
                // 更新燃烧室高度
                const chamberHeight = Math.max(0, this.pistonPosition - 100);
                this.combustion.style.height = `${chamberHeight}px`;
            }

            updateCycleIndicator() {
                const steps = document.querySelectorAll('.cycle-step');
                steps.forEach((step, index) => {
                    step.classList.remove('active');
                });

                const activeStep = Math.floor(this.currentCycle);
                if (activeStep < 4) {
                    steps[activeStep].classList.add('active');
                }
            }

            updateGasParticles() {
                const cycle = this.currentCycle;
                
                this.gasParticles.forEach((particle, index) => {
                    let opacity = 0;
                    let color = '#6496ff';
                    let x = 200;
                    let y = 150;

                    if (cycle >= 0 && cycle < 1) {
                        // 进气 - 蓝色气体进入
                        opacity = 0.6;
                        color = '#6496ff';
                        x = 145 + Math.random() * 30;
                        y = 100 + Math.random() * this.pistonPosition;
                    } else if (cycle >= 1 && cycle < 2) {
                        // 压缩 - 黄色气体
                        opacity = 0.7;
                        color = '#ffc864';
                        x = 180 + Math.random() * 40;
                        y = 100 + Math.random() * (this.pistonPosition - 100);
                    } else if (cycle >= 2 && cycle < 3) {
                        // 做功 - 红色火焰
                        opacity = 0.8;
                        color = '#ff6432';
                        x = 170 + Math.random() * 60;
                        y = 100 + Math.random() * (this.pistonPosition - 100);
                    } else {
                        // 排气 - 灰色废气
                        opacity = 0.4;
                        color = '#969696';
                        x = 225 + Math.random() * 30;
                        y = 100 + Math.random() * this.pistonPosition;
                    }

                    particle.style.opacity = opacity;
                    particle.style.background = color;
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                });
            }
        }

        // 初始化引擎模拟
        document.addEventListener('DOMContentLoaded', () => {
            new EngineSimulation();
        });
    </script>
</body>
</html>
